<script>

const $=i=>document.getElementById(i),TAU=Math.PI*2,R=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),V3=THREE.Vector3,angLerp=(a,b,t)=>a+(((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI)*t;

if(n==2){sp('g',3);sp('s',2);msg('Oleada 2: guardianes y acechadores del vacío')}
if(n==3){spawn('b',0,-30);msg('La arena está limpia. Entra al altar del Coloso, al norte')}}
function scr(id){['menu','pause','over'].forEach(x=>$(x).classList.toggle('on',x==id));$('hud').classList.toggle('on',G.st!='menu')}
function lock(){try{const r=$('cv').requestPointerLock();r&&r.catch&&r.catch(()=>{})}catch(e){}}
function unlock(){document.exitPointerLock&&document.exitPointerLock()}
function reset(){for(const e of E){scene.remove(e.g);scene.remove(e.bar)}E.length=0;for(const q of PR)scene.remove(q.m);PR.length=0;Q.length=0;for(const o of FX.list)scene.remove(o.m);FX.list.length=0;FX.life.fill(0);FX.pos.fill(-999);
P.hp=P.en=100;P.atk=P.ds=null;P.inv=0;P.vel.set(0,0,0);P.lu.set(0,0,0);P.cmT=0;P.sh=0;P.pos.set(0,0,30);P.ry=Math.PI;for(const k in P.cd)P.cd[k]=0;P.swap(0);
yaw=0;pitch=.25;Object.assign(G,{wave:0,pend:0,boss:null,shake:0,t:0,hs:0});$('boss').style.display='none'}
function start(){Snd.init();reset();G.st='play';scr(null);lock();msg('Avanza al norte, hacia la arena')}
function pause(){if(G.st!='play')return;G.st='pause';unlock();scr('pause')}
function resume(){G.st='play';scr(null);lock()}
function end(win){if(G.st!='play')return;G.st='over';unlock();$('ot').textContent=win?'Victoria':'Has caído';$('os').textContent=win?'El Coloso del eclipse ha sido destruido y el vacío retrocede. Tiempo: '+Math.round(G.t)+' s.':'La corrupción te consume. Pulsa para intentarlo de nuevo.';scr('over')}
function update(dt){G.t+=dt;P.update(dt);E.slice().forEach(e=>eUpdate(e,dt));prUpdate(dt);tickQ(dt);
if(!G.wave&&P.pos.z<14)wave(1);
if(G.wave&&G.wave<3&&!G.pend&&!E.some(e=>!e.dead)){G.pend=1;P.hp=Math.min(100,P.hp+25);P.en=100;msg('Oleada superada: salud restaurada');later(2.2,()=>{G.pend=0;wave(G.wave+1)})}}
function hud(){$('hpb').style.width=P.hp+'%';$('enb').style.width=P.en+'%';for(const k in SK){const el=$('s'+k);el.lastChild.style.height=P.cd[k]/SK[k].cd*100+'%';el.classList.toggle('off',P.en<SK[k].cost)}
WP.forEach((w,i)=>$('w'+i).classList.toggle('on',i==P.w));const b=G.boss;$('boss').style.display=b&&!b.dead&&!b.sleep?'block':'none';if(b)$('bb').style.width=Math.max(0,b.hp/b.max*100)+'%'}
function camUpdate(dt,t){if(G.st=='menu'){const a=t/1000*.12;cam.position.set(Math.cos(a)*30,11,Math.sin(a)*30);cam.lookAt(0,3,0);return}
const tx=P.pos.x,tz=P.pos.z,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),cp=Math.cos(pitch);let dist=7.5;
for(;dist>1.6;dist-=.5){const cx=tx-fx*dist*cp,cz=tz-fz*dist*cp;if(!OB.some(o=>Math.hypot(cx-o.x,cz-o.z)<o.r+.5))break}
const ft=62+(P.ds?16:(K.ShiftLeft&&P.vel.lengthSq()>25)?6:0);cam.fov+=(ft-cam.fov)*Math.min(1,8*dt);cam.updateProjectionMatrix();const sh=G.shake;cam.position.set(tx-fx*dist*cp+rx*.9+(R()-.5)*sh*.5,1.7+dist*Math.sin(pitch)+(R()-.5)*sh*.5,tz-fz*dist*cp+rz*.9);cam.lookAt(tx+rx*.9+fx*3,1.5,tz+rz*.9+fz*3);G.shake=Math.max(0,sh-dt*2.2)}
function frame(t){requestAnimationFrame(frame);const d0=Math.min((t-last)/1000||.016,.05);last=t;let dt=d0;if(G.hs>0){G.hs-=d0;dt*=.1}
if(G.st=='play')update(dt);else if(G.st=='over')tickQ(dt);if(G.st!='pause')FX.update(dt);
crystal.rotation.y=t/1000*.8;moteUpdate(t/1000);crystal.material.emissiveIntensity=1.6+Math.sin(t/400)*.6;crystal.position.y=4+Math.sin(t/700)*.3;if((G.msgT-=d0)<0)$('msg').style.opacity=0;
camUpdate(d0,t);hud();if(comp&&G.q)comp.render();else renderer.render(scene,cam)}

/* ===== Calidad, entrada y arranque ===== */
const QL=[['Baja',.6,0],['Media',1,1],['Alta',Math.min(window.devicePixelRatio||1,2),1]];
function resize(){renderer.setSize(innerWidth,innerHeight,false);comp&&comp.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
function setQ(i){G.q=i;const q=QL[i];renderer.setPixelRatio(q[1]);comp&&comp.setPixelRatio(q[1]);resize();sun.castShadow=!!q[2];['ql','ql2'].forEach(id=>$(id).textContent='Calidad: '+q[0])}
addEventListener('keydown',e=>{const c=e.code;K[c]=1;if(['Space','ArrowLeft','ArrowRight'].includes(c))e.preventDefault();if(e.repeat)return;
if(c=='Escape'){G.st=='play'?pause():G.st=='pause'&&resume();return}if(c=='KeyM'){Snd.on=!Snd.on;return}if(G.st!='play')return;
const n=+c[5];if(c=='Space')skDash();else if(c=='KeyQ')skPulse();else if(c=='KeyE')skLance();else if(c=='KeyR')skRupt();else if(c=='KeyF')skShield();else if(c.startsWith('Digit')&&n>=1&&n<=4)P.swap(n-1)});
addEventListener('keyup',e=>K[e.code]=0);
addEventListener('mousedown',e=>{if(G.st=='play'){M[e.button]=1;if(!document.pointerLockElement)lock()}});
addEventListener('mouseup',e=>M[e.button]=0);addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(G.st=='play'){yaw-=e.movementX*.0025;pitch=cl(pitch+e.movementY*.002,-.1,.9)}});
addEventListener('blur',()=>{for(const k in K)K[k]=0;M[0]=M[2]=0;pause()});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&G.st=='play')pause()});
addEventListener('click',e=>{if(e.target.tagName=='BUTTON'){Snd.init();Snd.play('ui')}});
addEventListener('resize',resize);
const sd=i=>{G.df=i;['df','df2'].forEach(id=>$(id).textContent='Dificultad: '+DF[i][0])};sd(1);$('df').onclick=$('df2').onclick=()=>sd((G.df+1)%3);$('go').onclick=start;$('res').onclick=resume;$('rs1').onclick=$('rs2').onclick=start;$('ql').onclick=$('ql2').onclick=()=>setQ((G.q+1)%3);
const HELP='<table><tr><td>W A S D<td>Moverse<tr><td>Ratón / ← →<td>Cámara<tr><td>Clic izquierdo<td>Ataque normal<tr><td>Clic derecho<td>Ataque pesado (gasta energía)<tr><td>Shift<td>Correr<tr><td>Espacio<td>Paso espectral (esquiva)<tr><td>Q<td>Pulso devastador<tr><td>E<td>Lanza del vacío (marca al enemigo)<tr><td>R<td>Ruptura dimensional<tr><td>1 2 3 4<td>Cambiar de arma<tr><td>F<td>Barrera del vacío (absorbe golpes 3 s)<tr><td>Esc / M<td>Pausa / silenciar</table>';
document.querySelectorAll('.help').forEach(e=>e.innerHTML=HELP);
$('sk').innerHTML=[['d','Esp','Paso','#3de0ff'],['q','Q','Pulso','#a45cff'],['e','E','Lanza','#a45cff'],['r','R','Ruptura','#ff8a1c'],['f','F','Barrera','#3de0ff']].map(([k,l,n,c])=>`<div class="sk" id="s${k}" style="border-color:${c}"><b>${l}</b>${n}<u></u></div>`).join('');
$('wn').innerHTML=WP.map((w,i)=>`<span id="w${i}">${i+1} ${w.n}<small>daño ${w.dmg} · alcance ${w.rng}</small></span>`).join('');
buildWorld();P.build();FX.init();mkComp();setQ(1);requestAnimationFrame(frame);
</script></body></html>
